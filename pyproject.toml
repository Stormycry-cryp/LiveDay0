[project]
name = "liveday0"
version = "0.1.0"
description = "A bounded, tenant-scoped life-memory core backed by PostgreSQL."
requires-python = ">=3.13,<3.14"
dependencies = [
  "psycopg[binary]>=3.2.9,<4",
]

[project.scripts]
liveday0 = "liveday0.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liveday0"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
