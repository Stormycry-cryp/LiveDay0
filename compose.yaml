services:
  postgres:
    image: ${LIVEDAY0_POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:17-alpine}
    environment:
      POSTGRES_DB: liveday0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LIVEDAY0_POSTGRES_PASSWORD:?set LIVEDAY0_POSTGRES_PASSWORD}
    ports:
      - "${LIVEDAY0_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liveday0"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - liveday0-postgres:/var/lib/postgresql/data

volumes:
  liveday0-postgres:
